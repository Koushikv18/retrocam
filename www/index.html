<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>RetroCam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="grp"><button id="btnDate" class="chip">DATE</button><button id="btnGrid" class="chip">GRID</button></div>
    <div class="grp"><button id="btnTimer" class="chip">TIMER OFF</button><button id="btnFlip" class="chip">FLIP</button></div>
  </header>
  <div id="viewfinder">
    <div id="frame"><canvas id="gl"></canvas><div id="gridlines" hidden></div><div id="flash"></div></div>
    <div id="presetName"></div><div id="count" hidden></div><div id="toast"></div>
  </div>
  <div id="presets"></div>
  <footer>
    <button id="thumb" aria-label="Gallery"></button>
    <button id="shutter" aria-label="Capture"></button>
    <button id="btnTorch" class="chip" style="display:none">FLASH</button>
  </footer>
</div>

<div id="gallery" class="overlay" hidden>
  <div class="ovh"><button id="gClose" class="chip">‹ BACK</button><span id="gCount"></span></div>
  <div id="grid"></div><div id="gEmpty" hidden>No photos yet</div>
</div>
<div id="viewer" class="overlay" hidden>
  <img id="vImg" alt="">
  <div class="vbar">
    <button id="vBack" class="chip">CLOSE</button>
    <button id="vShare" class="chip">SHARE</button>
    <button id="vSave" class="chip">SAVE TO PHOTOS</button>
    <button id="vDel" class="chip">DELETE</button>
  </div>
</div>
<div id="perm" hidden><p id="permMsg"></p><button id="permBtn">Try again</button></div>

<script src="presets.js"></script>
<script src="gl.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
