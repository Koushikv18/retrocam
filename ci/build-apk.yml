name: Build APK
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android

      - name: Native plugin + manifest
        run: |
          PKG=android/app/src/main/java/com/koushik/retrocam
          cp native/GallerySaverPlugin.java native/MainActivity.java $PKG/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' $M
          cat $M

      - name: App icon + splash
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0b0b' --splashBackgroundColor '#000000'

      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: retrocam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "latest" release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RetroCam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RetroCam.apk --title "RetroCam (latest build)" --notes "Built from commit ${GITHUB_SHA::7}. Install RetroCam.apk on Android (allow unknown apps)."

